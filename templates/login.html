{% import '_m.html' as m %}
<!DOCTYPE html>
<html lang="ur" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>لاگ اِن — {{ school.name }}</title><link rel="stylesheet" href="/static/app.css"></head>
<body class="login-page">
<svg width="0" height="0" style="position:absolute"><defs><symbol id="i-cap" viewBox="0 0 24 24"><path d="m2.5 9 9.5-5 9.5 5-9.5 5z"/><path d="M6.5 11.5v4.5c0 1.5 2.5 3 5.5 3s5.5-1.5 5.5-3v-4.5M21.5 9v6"/></symbol></defs></svg>
<form class="login-box" method="post" action="/login">
  <div class="brand-logo">{% if school.logo %}<img src="/static/{{ school.logo }}" alt="">{% else %}{{ m.icon('cap') }}{% endif %}</div>
  <h2>{{ school.name }}</h2><p class="muted">جاری رکھنے کے لیے پاس ورڈ درج کریں</p>
  {% if err %}<p class="chip red">{{ err }}</p>{% endif %}
  <div class="fld"><label for="pw">پاس ورڈ</label><input id="pw" type="password" name="password" autofocus required></div>
  <button class="btn btn-primary btn-lg btn-block">داخل ہوں</button>
</form></body></html>
